  <text x="50" y="70" font-family="'Orbitron', monospace, sans-serif" font-size="28" font-weight="900" fill="#00F0FF" letter-spacing="3">AUTÓDROMO DE INTERLAGOS</text>
  <text x="50" y="100" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8" letter-spacing="1">SÃO PAULO - SP | 4.30 KM | GRAU TÉCNICO INTERNACIONAL</text>
