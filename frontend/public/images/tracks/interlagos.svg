  <path d="M 200 150 C 250 110, 400 100, 520 130 C 640 160, 700 240, 680 320 C 660 380, 580 420, 480 400 C 380 380, 320 420, 240 400 C 160 380, 120 320, 140 240 C 150 190, 160 170, 200 150 Z" fill="none" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 200 150 C 250 110, 400 100, 520 130 C 640 160, 700 240, 680 320 C 660 380, 580 420, 480 400 C 380 380, 320 420, 240 400 C 160 380, 120 320, 140 240 C 150 190, 160 170, 200 150 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
